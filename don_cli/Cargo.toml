# don_cli/Cargo.toml

[package]
name = "don_cli"
version = "0.3.2"
edition = "2021"
description = "Official CLI for Don Framework - Scaffold Rust APIs in 1 second"
license = "MIT"

# Terminal command ka naam 'don' hoga!
[[bin]]
name = "don"
path = "src/main.rs"

[dependencies]
# CLI arguments parse karne ke liye
clap = { version = "4.5", features = ["derive"] }
# Terminal colors (Green, Blue, Bold) ke liye
colored = "2.1"